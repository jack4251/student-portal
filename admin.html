<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Upload Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Admin Panel</h2>
        <p class="text-sm text-gray-500 mb-6">Upload Excel spreadsheet containing student grades.</p>

        <div id="status-msg" class="hidden p-3 rounded mb-4 text-sm font-semibold text-center"></div>

        <form id="uploadForm">
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Select Excel File (.xlsx)</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="w-full p-2 border rounded-lg bg-gray-50 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <button type="button" onclick="uploadFile()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Upload Results</button>
        </form>
    </div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('excelFile');
            const statusDiv = document.getElementById('status-msg');

            if (!fileInput.files[0]) {
                statusDiv.innerText = "Please select an Excel file first.";
                statusDiv.className = "p-3 rounded mb-4 text-sm font-semibold text-center bg-red-100 text-red-700";
                statusDiv.classList.remove('hidden');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('http://127.0.0.1:8000/api/admin/upload-results', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Upload failed');
                }

                statusDiv.innerText = data.message;
                statusDiv.className = "p-3 rounded mb-4 text-sm font-semibold text-center bg-green-100 text-green-700";
                statusDiv.classList.remove('hidden');

            } catch (err) {
                statusDiv.innerText = err.message;
                statusDiv.className = "p-3 rounded mb-4 text-sm font-semibold text-center bg-red-100 text-red-700";
                statusDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
